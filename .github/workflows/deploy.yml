name: Deploy Frontend — GitHub Pages

# ¿Cuándo se ejecuta?
# - En cada push a main que toque algo del frontend o este mismo archivo
# - También se puede lanzar manualmente desde la pestaña Actions en GitHub
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# Permisos que necesita el workflow para poder escribir en GitHub Pages
permissions:
  contents: read   # leer el código del repositorio
  pages: write     # escribir/publicar en GitHub Pages
  id-token: write  # necesario para el sistema de autenticación de Pages

# Evita despliegues simultáneos: si llega un push nuevo mientras hay uno en curso,
# cancela el anterior y lanza el nuevo
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Desplegar en GitHub Pages
    runs-on: ubuntu-latest

    # Vincula el job al entorno "github-pages" para que GitHub muestre
    # la URL del despliegue en la pestaña Actions y en los commits
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # PASO 1: Descarga el código del repositorio en la máquina virtual
      - name: Descargar el codigo
        uses: actions/checkout@v4

      # PASO 2: Prepara la infraestructura de GitHub Pages en la máquina virtual
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      # PASO 3: Empaqueta la carpeta frontend/ como artefacto listo para publicar
      - name: Subir carpeta frontend como artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/   # solo se publica esta carpeta, no todo el repo

      # PASO 4: Publica el artefacto en GitHub Pages y devuelve la URL pública
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
